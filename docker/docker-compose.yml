services:
  bot:
    build: .
    env_file: ../.env
    depends_on:
      - postgres
      - redis
  postgres:
    restart: unless-stopped
    image: postgres:16
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: meme_bot
    ports: ['5432:5432']
  redis:
    restart: unless-stopped
    image: redis:7
    ports: ['6379:6379']
