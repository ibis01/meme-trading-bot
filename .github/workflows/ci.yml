name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unit:
    name: Typecheck · Lint · Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Unit tests
        run: npm test

  integration:
    name: Integration tests (Postgres + Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: unit
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: meme_bot
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://user:pass@localhost:5432/meme_bot
      REDIS_URL: redis://localhost:6379
      TRADING_MODE: paper
      SECURITY_PROVIDER: mock
      TELEGRAM_BOT_TOKEN: ''
      TELEGRAM_AUTHORIZED_USER_IDS: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Create integration test database
        env:
          ADMIN_DATABASE_URL: postgresql://user:pass@localhost:5432/postgres
        run: npm run db:create:test
      - name: Run integration tests
        env:
          TEST_DATABASE_URL: postgresql://user:pass@localhost:5432/meme_bot_test
          TEST_REDIS_URL: redis://localhost:6379/1
        run: npm run test:integration
